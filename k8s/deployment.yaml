apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-monitor-deployment
  labels:
    app.kubernetes.io/name: config-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: config-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-monitor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: config-monitor
          image: config-change-monitor:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: config-monitor-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: monitored-volume
              mountPath: /app/sample_configs
      volumes:
        - name: monitored-volume
          configMap:
            name: monitored-target-configs
