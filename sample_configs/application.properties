# Spring/Java-style Application Properties
spring.application.name=orders-microservice
server.port=9090
server.servlet.context-path=/orders

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

datasource.driver-class-name=org.postgresql.Driver
datasource.url=jdbc:postgresql://localhost:5432/orders_db
datasource.hikari.maximum-pool-size=20
datasource.hikari.minimum-idle=5
